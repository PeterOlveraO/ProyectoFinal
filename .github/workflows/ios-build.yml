# Build de iOS: Unity exporta el proyecto de Xcode (Linux) y macOS lo compila a un .ipa SIN firmar.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     correo de la cuenta de Unity
#   UNITY_PASSWORD  contraseña de la cuenta de Unity
# Con eso basta para una licencia Personal. Pro/Plus: añadir UNITY_SERIAL.
# Enterprise: UNITY_LICENSE (.ulf).
#
# El .ipa no está firmado: se instala re-firmándolo con AltStore / Sideloadly o con
# un certificado y perfil de Apple propios.
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unity-tests:
    name: Regresión EditMode + PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preparar diagnóstico y verificar validadores CI
        run: |
          mkdir -p artifacts/unity-tests
          python3 --version > artifacts/unity-tests/environment.txt
          python3 -m unittest discover -s ci/tests -v

      - name: Verificar secretos de Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Faltan UNITY_EMAIL y UNITY_PASSWORD (o UNITY_LICENSE)."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-6000.5.11f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-tests-6000.5.11f1-

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Una sola ejecución del runner: "all" ejecuta ambos modos, aun si uno falla.
      # No instrumentamos cobertura: este gate verifica comportamiento, no porcentajes.
      - name: Ejecutar EditMode y PlayMode (Unity 6000.5.11f1)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          cliVersion: v0.1.73
          testMode: all
          coverageEnabled: false
          artifactsPath: artifacts/unity-tests
          # El código de salida y los XML gobiernan el gate; no requiere checks:write.
          githubToken: ""

      - name: Exigir suites completas y resultados aprobados
        if: ${{ always() }}
        run: python3 ci/validate_test_results.py artifacts/unity-tests

      - name: Publicar resultados y logs de tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/unity-tests
          if-no-files-found: warn
          retention-days: 14

  unity-export:
    name: Exportar proyecto de Xcode (Unity)
    needs: unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Falla rápido: sin licencia, unity-builder descarga la imagen (~7 min) y luego aborta.
      - name: Verificar secretos de Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Faltan los secretos de Unity: configura UNITY_EMAIL y UNITY_PASSWORD (o UNITY_LICENSE) en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          # Evita consultar releases/latest de GitHub API (puede responder 403 por rate limit).
          cliVersion: v0.1.73
          targetPlatform: iOS
          buildMethod: Game.EditorTools.CIBuild.BuildIOS
          buildName: iOS
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          if-no-files-found: error
          retention-days: 3

  xcode-ipa:
    name: Compilar .ipa (Xcode)
    needs: unity-export
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

      - name: Compilar sin firmar
        run: |
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find build/iOS -maxdepth 3 -name '*.xcodeproj' | head -n 1)")"
          test -f "$PROJECT_DIR/Unity-iPhone.xcodeproj/project.pbxproj"
          echo "Proyecto de Xcode: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x process_symbols.sh MapFileParser.sh 2>/dev/null || true
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry ProyectoFinal-unsigned.ipa Payload
          ls -lh ProyectoFinal-unsigned.ipa

      - name: Validar estructura, bundle y ejecutable arm64 del IPA
        run: |
          python3 ci/validate_ipa.py \
            "$RUNNER_TEMP/ipa/ProyectoFinal-unsigned.ipa" \
            --report "$RUNNER_TEMP/ipa/validation.json"
          cat "$RUNNER_TEMP/ipa/validation.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ProyectoFinal-ipa
          path: |
            ${{ runner.temp }}/ipa/ProyectoFinal-unsigned.ipa
            ${{ runner.temp }}/ipa/validation.json
          if-no-files-found: error
          retention-days: 14
